<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday!</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #fff0f3;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app {
            text-align: center;
            z-index: 10;
        }


        .gift-box {
            font-size: 80px;
            cursor: pointer;
            display: inline-block;
            transition: transform 0.3s ease;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-20px);}
            60% {transform: translateY(-10px);}
        }

        .gift-box:active {
            transform: scale(0.9);
        }


        #message-container {
            display: none; 
            animation: popIn 0.8s cubic-bezier(0.17, 0.89, 0.32, 1.49);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .hbd-title {
            font-size: 2.2rem;
            color: #ff477e;
            margin: 0;
            line-height: 1.4;
        }

        .hbd-sub {
            font-size: 1rem;
            color: #ff85a1;
            margin-top: 15px;
        }

        .instruction {
            font-size: 0.9rem;
            color: #ff85a1;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div id="app">
        <div id="opener">
            <div class="gift-box" onclick="celebrate()">🎁</div>
            <p class="instruction">タップしてみて！</p>
        </div>

        <div id="message-container">
            <h1 class="hbd-title">ふうかちゃん<br>誕生日おめでとう！！</h1>
            <p class="hbd-sub">素敵な一年になりますように🎂</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <script>
        function celebrate() {
            document.getElementById('opener').style.display = 'none';
            const msg = document.getElementById('message-container');
            msg.style.display = 'block';

            const duration = 3 * 1000;
            const end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 3,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff477e', '#ff85a1', '#fbb1bd']
                });
                confetti({
                    particleCount: 3,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ff477e', '#ff85a1', '#fbb1bd']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());

            setTimeout(() => {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#ff0a54', '#ff477e', '#ffd700']
                });
            }, 500);
        }
    </script>
</body>
</html>
